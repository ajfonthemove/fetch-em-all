[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "fetch-em-all"
version = "0.1.1"
description = "Download URLs through your own browser on macOS, in the background, filed and checksummed."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = ["pyyaml>=6"]
classifiers = [
    "Environment :: Console",
    "Environment :: MacOS X",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP",
]

[project.optional-dependencies]
tls = ["certifi"]

[project.scripts]
fetch-em-all = "fetch_em_all.cli:main"

[project.urls]
Homepage = "https://github.com/ajfonthemove/fetch-em-all"

[tool.setuptools]
packages = ["fetch_em_all"]
