name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Ubuntu only: macOS runners are deliberately not used (cost). The offline tests are platform-independent.
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e .
      - run: python -W error::ResourceWarning -m unittest discover -s tests -t . -v
      - run: fetch-em-all plan examples/fetch.yaml --list
